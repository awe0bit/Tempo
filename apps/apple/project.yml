name: TempoApple
options:
  minimumXcodeGenVersion: 2.42.0
  developmentLanguage: zh-Hans
  deploymentTarget:
    iOS: "17.0"
    macOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.8.0"
    CURRENT_PROJECT_VERSION: "235"
    CLANG_ENABLE_MODULES: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
packages:
  TempoRuntimePackage:
    path: ../ios-runtime/artifacts/TempoRuntimePackage-release
targets:
  TempoiOS:
    type: application
    platform: iOS
    sources:
      - path: Shared
      - path: iOS
      - path: ../flutter/ios/Shared/TempoPomodoroAttributes.swift
      - path: ../flutter/ios/Runner/Assets.xcassets
        buildPhase: resources
      - path: Resources/MainApp
        buildPhase: resources
    dependencies:
      - target: TempoWidgets
        embed: true
      - package: TempoRuntimePackage
        product: TempoRuntimePackage-release
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: one.darker.qingxu
        PRODUCT_NAME: TEMPO
        INFOPLIST_KEY_CFBundleDisplayName: Tempo
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Configuration/TempoiOS.entitlements
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: "$(IOS_DEVELOPMENT_TEAM)"
        PROVISIONING_PROFILE_SPECIFIER: "$(IOS_MAIN_PROFILE_SPECIFIER)"
        SUPPORTS_MACCATALYST: NO
        TARGETED_DEVICE_FAMILY: "1,2"
    info:
      path: Generated/TempoiOS-Info.plist
      properties:
        CFBundleDisplayName: Tempo
        CFBundleDevelopmentRegion: zh-Hans
        CFBundleLocalizations:
          - zh-Hans
          - en
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen:
          UIColorName: TempoLaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        CFBundleURLTypes:
          - CFBundleURLName: one.darker.qingxu
            CFBundleURLSchemes: [tempo, qingxu]
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
        BGTaskSchedulerPermittedIdentifiers:
          - one.darker.qingxu.rss.refresh
        UIBackgroundModes:
          - fetch
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
  TempoWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: ../flutter/ios/TempoWidgets/TempoWidgets.swift
      - path: ../flutter/ios/Shared/TempoPomodoroAttributes.swift
      - path: Resources/Widgets
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: one.darker.qingxu.widgets
        PRODUCT_NAME: TEMPOWidgets
        CODE_SIGN_ENTITLEMENTS: Configuration/TempoWidgets.entitlements
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: "$(IOS_DEVELOPMENT_TEAM)"
        PROVISIONING_PROFILE_SPECIFIER: "$(IOS_WIDGET_PROFILE_SPECIFIER)"
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1,2"
    info:
      path: Configuration/TempoWidgets-Info.plist
      properties:
        CFBundleDisplayName: Tempo小组件
        CFBundleDevelopmentRegion: zh-Hans
        CFBundleLocalizations:
          - zh-Hans
          - en
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        NSSupportsLiveActivities: true
  TempomacOS:
    type: application
    platform: macOS
    sources:
      - path: Shared
      - path: macOS
      - path: ../flutter/macos/Runner/Assets.xcassets
        buildPhase: resources
    dependencies:
      - target: TempomacOSWidgets
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: one.darker.qingxu
        PRODUCT_NAME: TEMPO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Configuration/TempomacOS.entitlements
        ENABLE_HARDENED_RUNTIME: YES
    info:
      path: Generated/TempomacOS-Info.plist
      properties:
        CFBundleDisplayName: Tempo
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSApplicationCategoryType: public.app-category.productivity
        CFBundleURLTypes:
          - CFBundleURLName: one.darker.qingxu
            CFBundleURLSchemes: [tempo, qingxu]
  TempomacOSWidgets:
    type: app-extension
    platform: macOS
    sources:
      - path: macOSWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: one.darker.qingxu.macos.widgets
        PRODUCT_NAME: TEMPOWidgets
        CODE_SIGN_ENTITLEMENTS: Configuration/TempomacOSWidgets.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    info:
      path: Generated/TempomacOSWidgets-Info.plist
      properties:
        CFBundleDisplayName: Tempo桌面小组件
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
