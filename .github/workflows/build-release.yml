name: Build and Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      platform:
        description: 构建平台 / Platform；auto 根据提交自动选择
        required: true
        default: auto
        type: choice
        options:
          - auto
          - ios
          - android
          - windows
          - macos
          - all

permissions:
  contents: read

concurrency:
  group: tempo-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      build_number: ${{ steps.resolve.outputs.build_number }}
      should_release: ${{ steps.resolve.outputs.should_release }}
      publish_server: ${{ steps.resolve.outputs.publish_server }}
      build_ios: ${{ steps.resolve.outputs.build_ios }}
      build_android: ${{ steps.resolve.outputs.build_android }}
      build_windows: ${{ steps.resolve.outputs.build_windows }}
      build_macos: ${{ steps.resolve.outputs.build_macos }}
      build_server: ${{ steps.resolve.outputs.build_server }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Resolve build version
        id: resolve
        shell: bash
        env:
          REQUESTED_PLATFORM: ${{ inputs.platform || 'auto' }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          current="$(sed -nE 's/^version:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' apps/flutter/pubspec.yaml)"
          if [[ ! "$current" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid Flutter version in apps/flutter/pubspec.yaml: $current" >&2
            exit 1
          fi

          build_ios=false
          build_android=false
          build_windows=false
          build_macos=false
          build_server=false

          mark_all_clients() {
            build_ios=true
            build_android=true
            build_windows=true
            build_macos=true
          }

          requested="${REQUESTED_PLATFORM:-auto}"
          apple_scope="all"
          ota_only=false
          head_subject="$(git log -1 --pretty=%s "$GITHUB_SHA")"
          case "$head_subject" in
            *"(ios):"*|*"[ios-only]"*) apple_scope="ios" ;;
            *"(macos):"*|*"[macos-only]"*) apple_scope="macos" ;;
          esac
          if [[ "$head_subject" == *"[ota-only]"* ]]; then
            ota_only=true
          fi
          if [[ "$GITHUB_REF" == refs/tags/v* || "$requested" == "all" ]]; then
            mark_all_clients
          elif [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$requested" != "auto" ]]; then
            case "$requested" in
              ios) build_ios=true ;;
              android) build_android=true ;;
              windows) build_windows=true ;;
              macos) build_macos=true ;;
              *) echo "Unknown platform: $requested" >&2; exit 1 ;;
            esac
          else
            if [[ "$GITHUB_EVENT_NAME" == "pull_request" && -n "${PR_BASE_SHA:-}" ]]; then
              base="$PR_BASE_SHA"
            elif [[ "$GITHUB_EVENT_NAME" == "push" && -n "${BEFORE_SHA:-}" && ! "$BEFORE_SHA" =~ ^0+$ ]]; then
              base="$BEFORE_SHA"
            elif git rev-parse "${GITHUB_SHA}^" >/dev/null 2>&1; then
              base="${GITHUB_SHA}^"
            else
              base="$GITHUB_SHA"
            fi

            while IFS= read -r path; do
              case "$path" in
                apps/apple/Shared/*)
                  case "$apple_scope" in
                    ios) build_ios=true ;;
                    macos) build_macos=true ;;
                    *) build_ios=true; build_macos=true ;;
                  esac ;;
                apps/apple/iOS/*|apps/apple/Configuration/TempoiOS.entitlements|apps/apple/Configuration/TempoWidgets.entitlements)
                  build_ios=true ;;
                apps/apple/macOS/*|apps/apple/macOSWidgets/*|apps/apple/Configuration/TempomacOS.entitlements|apps/apple/Configuration/TempomacOSWidgets.entitlements)
                  build_macos=true ;;
                apps/apple/project.yml)
                  case "$apple_scope" in
                    ios) build_ios=true ;;
                    macos) build_macos=true ;;
                    *) build_ios=true; build_macos=true ;;
                  esac ;;
                apps/ios-runtime/package.json|apps/ios-runtime/package-lock.json)
                  # A pure-JavaScript package can ship inside the OTA bundle. The
                  # explicit marker prevents an unnecessary IPA while native
                  # dependency changes keep the safe rebuild default.
                  if [[ "$ota_only" != true ]]; then build_ios=true; fi ;;
                apps/ios-runtime/app.config.js|apps/ios-runtime/runtime-version.txt|apps/ios-runtime/scripts/*|apps/ios-runtime/babel.config.js|apps/ios-runtime/metro.config.js)
                  build_ios=true ;;
                apps/flutter/ios/TempoWidgets/*|apps/flutter/ios/Shared/TempoPomodoroAttributes.swift)
                  build_ios=true ;;
                apps/flutter/ios/Runner/Assets.xcassets/*)
                  build_ios=true ;;
                apps/android/*)
                  build_android=true ;;
                apps/flutter/*|scripts/windows/*)
                  build_windows=true ;;
                services/sync/*)
                  build_server=true ;;
                assets/*|scripts/generate_brand_assets.py)
                  if [[ "$apple_scope" == "ios" ]]; then
                    build_ios=true
                  else
                    mark_all_clients
                  fi ;;
              esac
            done < <(git diff --name-only "$base" "$GITHUB_SHA")
          fi

          client_changed=false
          if [[ "$build_ios" == true || "$build_android" == true || "$build_windows" == true || "$build_macos" == true ]]; then
            client_changed=true
          fi

          should_release=false
          publish_server=false
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            should_release="$client_changed"
          elif [[ ( "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/main" ) || "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "$build_server" == true ]]; then publish_server=true; fi
            if [[ "$client_changed" != true ]]; then
              version="$current"
            else
              existing_tag="$(git tag --points-at "$GITHUB_SHA" --list 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)"
              if [[ -n "$existing_tag" ]]; then
                version="${existing_tag#v}"
              else
                latest_tag="$(git tag --list 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)"
                if [[ -z "$latest_tag" ]]; then
                  version="$current"
                else
                  latest="${latest_tag#v}"
                  newest="$(printf '%s\n%s\n' "$current" "$latest" | sort -V | tail -n 1)"
                  if [[ "$newest" == "$current" && "$current" != "$latest" ]]; then
                    # A manually prepared source version is already the next release.
                    version="$current"
                  else
                    IFS=. read -r major minor patch <<< "$latest"
                    # TEMPO uses one digit per segment. Legacy versions such as
                    # 0.1.61 migrate to the next minor release instead of becoming
                    # visually insignificant four- or five-digit patch streams.
                    if (( patch >= 10 )); then
                      minor=$((minor + 1))
                      patch=0
                    elif (( minor >= 10 )); then
                      major=$((major + 1))
                      minor=0
                      patch=0
                    else
                      patch=$((patch + 1))
                      if (( patch >= 10 )); then
                        patch=0
                        minor=$((minor + 1))
                      fi
                    fi

                    if (( minor >= 10 )); then
                      major=$((major + 1))
                      minor=0
                    fi
                    version="$major.$minor.$patch"
                  fi
                fi
              fi
            fi
            should_release="$client_changed"
          else
            version="$current"
          fi

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must use x.y.z format: $version" >&2
            exit 1
          fi

          IFS=. read -r major minor patch <<< "$version"
          if (( major > 9 || minor > 9 || patch > 9 )); then
            echo "Each version segment must be a single digit (0-9): $version" >&2
            exit 1
          fi

          {
            echo "version=$version"
            echo "tag=v$version"
            echo "build_number=$GITHUB_RUN_NUMBER"
            echo "should_release=$should_release"
            echo "publish_server=$publish_server"
            echo "build_ios=$build_ios"
            echo "build_android=$build_android"
            echo "build_windows=$build_windows"
            echo "build_macos=$build_macos"
            echo "build_server=$build_server"
          } >> "$GITHUB_OUTPUT"
          echo "TEMPO v$version ($GITHUB_RUN_NUMBER): ios=$build_ios android=$build_android windows=$build_windows macos=$build_macos server=$build_server release=$should_release"

  flutter-checks:
    if: needs.version.outputs.build_windows == 'true'
    needs: version
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/flutter
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  sync-server:
    if: needs.version.outputs.build_server == 'true'
    needs: version
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/sync
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: services/sync/go.mod
          cache-dependency-path: services/sync/go.mod
      - name: Test sync service
        run: go test ./...
      - name: Vet sync service
        run: go vet ./...
      - name: Build sync container
        run: docker build --tag tempo-sync:test .

  docker-publish:
    if: >-
      always() &&
      needs.version.outputs.publish_server == 'true' &&
      needs.sync-server.result == 'success'
    needs: [version, sync-server]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: services/sync
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/tempo-sync:${{ needs.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/tempo-sync:latest
            ghcr.io/${{ github.repository_owner }}/qingxu-sync:${{ needs.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/qingxu-sync:latest
          labels: |
            org.opencontainers.image.title=tempo-sync
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.version.outputs.version }}

  flutter-windows:
    if: >-
      always() &&
      needs.version.outputs.build_windows == 'true' &&
      needs.flutter-checks.result == 'success'
    needs: [version, flutter-checks]
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/flutter
    env:
      APP_VERSION: ${{ needs.version.outputs.version }}
      BUILD_NUMBER: ${{ needs.version.outputs.build_number }}
      WINDOWS_SIGNING_CERTIFICATE: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE }}
      WINDOWS_SIGNING_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release --build-name "$env:APP_VERSION" --build-number "$env:BUILD_NUMBER"
      - name: Add VC runtime and package portable ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $release = (Resolve-Path "build\windows\x64\runner\Release").Path
          $runtime = $null

          if ($env:VCToolsRedistDir) {
            $candidate = Join-Path $env:VCToolsRedistDir "x64\Microsoft.VC143.CRT"
            if (Test-Path $candidate) { $runtime = $candidate }
          }

          if (-not $runtime) {
            $vswhere = Join-Path "${env:ProgramFiles(x86)}" "Microsoft Visual Studio\Installer\vswhere.exe"
            if (Test-Path $vswhere) {
              $vsInstall = & $vswhere -latest -products * -property installationPath
              if ($vsInstall) {
                $redistRoot = Join-Path $vsInstall "VC\Redist\MSVC"
                if (Test-Path $redistRoot) {
                  $runtime = Get-ChildItem $redistRoot -Directory |
                    Sort-Object Name -Descending |
                    ForEach-Object { Join-Path $_.FullName "x64\Microsoft.VC143.CRT" } |
                    Where-Object { Test-Path $_ } |
                    Select-Object -First 1
                }
              }
            }
          }

          if ($runtime) {
            Write-Host "Bundling VC++ runtime from $runtime"
            Copy-Item "$runtime\*.dll" $release -Force
          }

          $required = @("msvcp140.dll", "vcruntime140.dll", "vcruntime140_1.dll")
          foreach ($dll in $required) {
            $destination = Join-Path $release $dll
            if (-not (Test-Path $destination)) {
              $fallback = Join-Path "$env:SystemRoot\System32" $dll
              if (Test-Path $fallback) {
                Copy-Item $fallback $destination -Force
              }
            }
            if (-not (Test-Path $destination)) {
              throw "Required VC++ runtime DLL is missing: $dll"
            }
          }

          Get-Item ($required | ForEach-Object { Join-Path $release $_ }) |
            Select-Object Name, Length, VersionInfo

          if (-not [string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_CERTIFICATE)) {
            $certificate = Join-Path $env:RUNNER_TEMP "tempo-signing.pfx"
            [IO.File]::WriteAllBytes(
              $certificate,
              [Convert]::FromBase64String($env:WINDOWS_SIGNING_CERTIFICATE)
            )
            $signTool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" `
              -Filter signtool.exe -Recurse |
              Where-Object { $_.FullName -match '\\x64\\signtool\.exe$' } |
              Sort-Object FullName -Descending |
              Select-Object -First 1
            if (-not $signTool) { throw "signtool.exe was not found" }
            & $signTool.FullName sign /fd SHA256 /f $certificate `
              /p $env:WINDOWS_SIGNING_PASSWORD /tr http://timestamp.digicert.com `
              /td SHA256 "$release\TEMPO.exe"
            if ($LASTEXITCODE -ne 0) { throw "Signing TEMPO.exe failed" }
            Remove-Item -LiteralPath $certificate -Force
          } else {
            Write-Host "No trusted signing certificate configured; publishing an unsigned beta build."
          }

          $portable = "..\..\TEMPO-$($env:APP_VERSION)-Windows-Portable.zip"
          Compress-Archive -Path "$release\*" -DestinationPath $portable
      - name: Build installer EXE
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$env:APP_VERSION" scripts\windows\Tempo.iss
      - name: Sign installer when a trusted certificate is configured
        if: env.WINDOWS_SIGNING_CERTIFICATE != ''
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: |
          $ErrorActionPreference = "Stop"
          $certificate = Join-Path $env:RUNNER_TEMP "tempo-signing.pfx"
          [IO.File]::WriteAllBytes(
            $certificate,
            [Convert]::FromBase64String($env:WINDOWS_SIGNING_CERTIFICATE)
          )
          $signTool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" `
            -Filter signtool.exe -Recurse |
            Where-Object { $_.FullName -match '\\x64\\signtool\.exe$' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $signTool) { throw "signtool.exe was not found" }
          $installer = "artifacts\TEMPO-$($env:APP_VERSION)-Windows-Setup.exe"
          & $signTool.FullName sign /fd SHA256 /f $certificate `
            /p $env:WINDOWS_SIGNING_PASSWORD /tr http://timestamp.digicert.com `
            /td SHA256 $installer
          if ($LASTEXITCODE -ne 0) { throw "Signing the installer failed" }
          & $signTool.FullName verify /pa /v $installer
          if ($LASTEXITCODE -ne 0) { throw "Installer signature verification failed" }
          Remove-Item -LiteralPath $certificate -Force
      - uses: actions/upload-artifact@v7
        with:
          name: tempo-${{ needs.version.outputs.version }}-windows
          retention-days: 7
          path: |
            TEMPO-${{ needs.version.outputs.version }}-Windows-Portable.zip
            artifacts/TEMPO-${{ needs.version.outputs.version }}-Windows-Setup.exe

  apple-runtime:
    if: needs.version.outputs.build_ios == 'true' || needs.version.outputs.build_macos == 'true'
    needs: version
    runs-on: macos-26
    defaults:
      run:
        working-directory: apps/ios-runtime
    env:
      TEMPO_APP_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/ios-runtime/package-lock.json
      - run: npm ci
      - name: Generate native OTA runtime
        env:
          CI: "1"
        run: npm run prebuild:ios
      - name: Build isolated Swift Package
        run: npm run build:brownfield:ios
      - name: Verify runtime package
        run: test -f artifacts/TempoRuntimePackage-release/Package.swift
      - uses: actions/upload-artifact@v7
        with:
          name: tempo-native-runtime-${{ github.run_id }}
          path: apps/ios-runtime/artifacts/TempoRuntimePackage-release
          if-no-files-found: error
          retention-days: 1

  apple-ios:
    if: >-
      always() &&
      needs.version.outputs.build_ios == 'true' &&
      needs.apple-runtime.result == 'success'
    needs: [version, apple-runtime]
    runs-on: macos-26
    defaults:
      run:
        working-directory: apps/apple
    env:
      APP_VERSION: ${{ needs.version.outputs.version }}
      BUILD_NUMBER: ${{ needs.version.outputs.build_number }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: tempo-native-runtime-${{ github.run_id }}
          path: apps/ios-runtime/artifacts/TempoRuntimePackage-release
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Show selected Xcode
        run: xcodebuild -version
      - name: Install XcodeGen
        run: |
          brew install xcodegen
          xcodegen version
      - name: Generate native Apple project
        run: xcodegen generate
      - name: Verify stable iOS upgrade identity
        run: |
          set -euo pipefail
          grep -q 'PRODUCT_BUNDLE_IDENTIFIER: one.darker.qingxu$' project.yml
          grep -q 'PRODUCT_BUNDLE_IDENTIFIER: one.darker.qingxu.widgets$' project.yml
          grep -q 'group.one.darker.qingxu' Configuration/TempoiOS.entitlements
          grep -q 'group.one.darker.qingxu' Configuration/TempoWidgets.entitlements
      - name: Build unsigned native iOS app
        run: |
          set -euo pipefail
          xcodebuild \
            -project TempoApple.xcodeproj \
            -scheme TempoiOS \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            MARKETING_VERSION="$APP_VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            build
      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/TEMPO.app"
          test -d "$APP_PATH/PlugIns/TEMPOWidgets.appex"
          test "$(/usr/libexec/PlistBuddy -c 'Print :NSSupportsLiveActivities' "$APP_PATH/Info.plist")" = "true"
          test "$(/usr/libexec/PlistBuddy -c 'Print :NSSupportsLiveActivities' "$APP_PATH/PlugIns/TEMPOWidgets.appex/Info.plist")" = "true"
          mkdir -p build/ipa/Payload
          cp -R "$APP_PATH" build/ipa/Payload/TEMPO.app
          cd build/ipa && zip -r "../../TEMPO-${APP_VERSION}-iOS-unsigned.ipa" Payload
      - uses: actions/upload-artifact@v7
        with:
          name: tempo-${{ needs.version.outputs.version }}-ios
          retention-days: 7
          path: apps/apple/TEMPO-${{ needs.version.outputs.version }}-iOS-unsigned.ipa

  flutter-android:
    if: needs.version.outputs.build_android == 'true'
    needs: version
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    env:
      APP_VERSION: ${{ needs.version.outputs.version }}
      BUILD_NUMBER: ${{ needs.version.outputs.build_number }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test
      - name: Detect and configure stable Android release signing
        id: android-signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ "${{ needs.version.outputs.should_release }}" != "true" ]]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ -z "$ANDROID_KEYSTORE_BASE64" || -z "$ANDROID_KEYSTORE_PASSWORD" || -z "$ANDROID_KEY_ALIAS" || -z "$ANDROID_KEY_PASSWORD" ]]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Android stable signing secrets are incomplete. Android release assets will be skipped; iOS, Windows, macOS and server releases will continue."
            exit 0
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/qingxu-release.jks
          cat > android/key.properties <<EOF
          storeFile=qingxu-release.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF
          echo "ANDROID_KEY_PROPERTIES=$PWD/android/key.properties" >> "$GITHUB_ENV"
          echo "configured=true" >> "$GITHUB_OUTPUT"
      - name: Build Android APK
        if: needs.version.outputs.should_release != 'true' || steps.android-signing.outputs.configured == 'true'
        run: >-
          flutter build apk --release
          --build-name "$APP_VERSION"
          --build-number "$BUILD_NUMBER"
          --dart-define "APP_VERSION=$APP_VERSION"
          --dart-define "APP_BUILD=$BUILD_NUMBER"
      - name: Package Android APK
        if: needs.version.outputs.should_release != 'true' || steps.android-signing.outputs.configured == 'true'
        run: cp build/app/outputs/flutter-apk/app-release.apk "TEMPO-${APP_VERSION}-Android.apk"
      - name: Generate Android incremental update assets
        if: needs.version.outputs.should_release == 'true' && steps.android-signing.outputs.configured == 'true'
        run: |
          set -euo pipefail
          full="TEMPO-${APP_VERSION}-Android.apk"
          full_sha="$(sha256sum "$full" | cut -d' ' -f1)"
          previous_tag="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=50" --jq '
            [.[]
              | select(.tag_name | test("^v[0-9]+\\.[0-9]+\\.[0-9]+$"))
              | select(any(.assets[]?; .name == "tempo-android-update.json"))
            ][0].tag_name // empty
          ')"
          previous_version="${previous_tag#v}"
          patch_name=""
          if [[ -n "$previous_tag" && "$previous_tag" != "v${APP_VERSION}" ]]; then
            mkdir -p previous
            if gh release download "$previous_tag" \
              --repo "$GITHUB_REPOSITORY" \
              --pattern "TEMPO-*-Android.apk" \
              --dir previous; then
              old_apk="$(find previous -maxdepth 1 -name 'TEMPO-*-Android.apk' -print -quit)"
              if [[ -n "$old_apk" ]]; then
                patch_name="TEMPO-${previous_version}-to-${APP_VERSION}-Android.bpatch"
                # APK binary diffs can become CPU-heavy when ZIP ordering changes.
                # A patch is an optional optimization: never let it block the full
                # APK release. Fall back to the verified full installer after 3 min.
                if ! timeout 180s dart run tool/create_binary_patch.dart "$old_apk" "$full" "$patch_name"; then
                  echo "Incremental patch generation failed or timed out; publishing full APK only."
                  rm -f "$patch_name" "$patch_name.verified"
                  patch_name=""
                fi
              fi
            fi
          fi
          FULL_SHA="$full_sha" PREVIOUS_VERSION="$previous_version" PATCH_NAME="$patch_name" \
            python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path

          version = os.environ["APP_VERSION"]
          repo = os.environ["GITHUB_REPOSITORY"]
          base = f"https://github.com/{repo}/releases/download/v{version}"
          full_name = f"TEMPO-{version}-Android.apk"
          payload = {
              "schema": 1,
              "latestVersion": version,
              "fullUrl": f"{base}/{full_name}",
              "fullSha256": os.environ["FULL_SHA"],
              "patches": {},
          }
          patch_name = os.environ.get("PATCH_NAME", "")
          previous = os.environ.get("PREVIOUS_VERSION", "")
          if patch_name and Path(patch_name).is_file() and previous:
              patch = Path(patch_name)
              payload["patches"][previous] = {
                  "url": f"{base}/{patch.name}",
                  "size": patch.stat().st_size,
                  "sha256": hashlib.sha256(patch.read_bytes()).hexdigest(),
              }
          Path("tempo-android-update.json").write_text(
              json.dumps(payload, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY
      - uses: actions/upload-artifact@v7
        if: needs.version.outputs.should_release != 'true' || steps.android-signing.outputs.configured == 'true'
        with:
          name: tempo-${{ needs.version.outputs.version }}-android
          retention-days: 7
          path: |
            apps/android/TEMPO-${{ needs.version.outputs.version }}-Android.apk
            apps/android/TEMPO-*-to-${{ needs.version.outputs.version }}-Android.bpatch
            apps/android/tempo-android-update.json

  apple-macos:
    if: >-
      always() &&
      needs.version.outputs.build_macos == 'true' &&
      needs.apple-runtime.result == 'success'
    needs: [version, apple-runtime]
    runs-on: macos-26
    defaults:
      run:
        working-directory: apps/apple
    env:
      APP_VERSION: ${{ needs.version.outputs.version }}
      BUILD_NUMBER: ${{ needs.version.outputs.build_number }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: tempo-native-runtime-${{ github.run_id }}
          path: apps/ios-runtime/artifacts/TempoRuntimePackage-release
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Install XcodeGen
        run: |
          brew install xcodegen
          xcodegen version
      - name: Generate native Apple project
        run: xcodegen generate
      - name: Build native macOS app
        run: |
          set -euo pipefail
          xcodebuild \
            -project TempoApple.xcodeproj \
            -scheme TempomacOS \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            MARKETING_VERSION="$APP_VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            build
      - name: Package macOS app
        run: |
          set -euo pipefail
          app_path="$(find build/DerivedData/Build/Products/Release -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$app_path"
          ditto -c -k --keepParent "$app_path" "TEMPO-${APP_VERSION}-macOS-Portable.zip"
          hdiutil create -volname "TEMPO" -srcfolder "$app_path" -ov -format UDZO "TEMPO-${APP_VERSION}-macOS.dmg"
      - uses: actions/upload-artifact@v7
        with:
          name: tempo-${{ needs.version.outputs.version }}-macos
          retention-days: 7
          path: |
            apps/apple/TEMPO-${{ needs.version.outputs.version }}-macOS-Portable.zip
            apps/apple/TEMPO-${{ needs.version.outputs.version }}-macOS.dmg

  github-release:
    if: >-
      always() &&
      needs.version.outputs.should_release == 'true' &&
      (needs.flutter-windows.result == 'success' || needs.flutter-windows.result == 'skipped') &&
      (needs.apple-ios.result == 'success' || needs.apple-ios.result == 'skipped') &&
      (needs.flutter-android.result == 'success' || needs.flutter-android.result == 'skipped') &&
      (needs.apple-macos.result == 'success' || needs.apple-macos.result == 'skipped')
    needs: [version, flutter-windows, apple-ios, flutter-android, apple-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      APP_VERSION: ${{ needs.version.outputs.version }}
      BUILD_NUMBER: ${{ needs.version.outputs.build_number }}
      RELEASE_TAG: ${{ needs.version.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          pattern: tempo-${{ needs.version.outputs.version }}-*
          path: release-assets
          merge-multiple: true
      - name: Generate SHA-256 checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          checksum_file="$(mktemp)"
          find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -printf '%f\0' \
            | sort -z \
            | xargs -0 sha256sum > "$checksum_file"
          mv "$checksum_file" SHA256SUMS.txt
      - name: Attest release build provenance
        uses: actions/attest@v4
        with:
          subject-path: release-assets/*
      - name: Publish GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' release_files < <(find release-assets -type f -print0)
          if (( ${#release_files[@]} == 0 )); then
            echo "No release files were downloaded." >&2
            exit 1
          fi
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # Create the release first, then upload with --clobber. Passing every
            # asset to `gh release create` can leave a partial draft when one
            # upload is retried and GitHub reports that the asset already exists.
            gh release create "$RELEASE_TAG" \
              --draft \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --generate-notes \
              --title "TEMPO $RELEASE_TAG"
          fi

          gh release upload "$RELEASE_TAG" "${release_files[@]}" \
            --clobber \
            --repo "$GITHUB_REPOSITORY"

          gh release edit "$RELEASE_TAG" \
            --draft=false \
            --prerelease=false \
            --latest \
            --repo "$GITHUB_REPOSITORY"
  version-writeback:
    if: >-
      always() &&
      needs.github-release.result == 'success' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch')
    needs: [version, github-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      APP_VERSION: ${{ needs.version.outputs.version }}
      BUILD_NUMBER: ${{ needs.version.outputs.build_number }}
      RELEASE_TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Persist released version in source
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          remote_sha="$(git rev-parse origin/main)"
          if [[ "$remote_sha" != "$GITHUB_SHA" ]]; then
            echo "main moved to $remote_sha; leaving version write-back to the newer workflow."
            exit 0
          fi
          git checkout --detach "$GITHUB_SHA"

          remote_version="$(sed -nE 's/^version:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' apps/flutter/pubspec.yaml)"
          newest="$(printf '%s\n%s\n' "$remote_version" "$APP_VERSION" | sort -V | tail -n 1)"
          if [[ "$newest" != "$APP_VERSION" ]]; then
            echo "Source contains newer version $remote_version; skipping v$APP_VERSION write-back."
            exit 0
          fi

          sed -i -E "s/^version:.*/version: ${APP_VERSION}+${BUILD_NUMBER}/" apps/flutter/pubspec.yaml
          sed -i -E "s/^version:.*/version: ${APP_VERSION}+${BUILD_NUMBER}/" apps/android/pubspec.yaml
          sed -i -E "s/^([[:space:]]*)MARKETING_VERSION:.*/\1MARKETING_VERSION: \"${APP_VERSION}\"/" apps/apple/project.yml
          sed -i -E "s/^([[:space:]]*)CURRENT_PROJECT_VERSION:.*/\1CURRENT_PROJECT_VERSION: \"${BUILD_NUMBER}\"/" apps/apple/project.yml
          sed -i -E "s/^([[:space:]]*)#define MyAppVersion .*/\1#define MyAppVersion \"${APP_VERSION}\"/" scripts/windows/Tempo.iss

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/flutter/pubspec.yaml apps/android/pubspec.yaml apps/apple/project.yml scripts/windows/Tempo.iss
          if git diff --cached --quiet; then
            echo "Version metadata is already current."
          else
            git commit -m "chore: bump version to $RELEASE_TAG [skip ci]"
            git push origin HEAD:main
          fi
