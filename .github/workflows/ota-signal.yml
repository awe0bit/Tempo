name: Tempo Sync Service

on:
  push:
    branches: [main]
    paths:
      - "services/sync/**"
      - "deploy/tempo-services/**"
      - "!**/*.md"
    # Workflow-only edits can be validated without redeploying the server;
    # use workflow_dispatch when applying a deployment workflow change.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tempo-services-production
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/sync
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.0'
          cache-dependency-path: services/sync/go.mod
      - run: go mod download
      - run: go test -race ./...
      - run: go vet ./...

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY_BASE64: ${{ secrets.DEPLOY_SSH_KEY_BASE64 }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s' "$DEPLOY_SSH_KEY_BASE64" | base64 --decode > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Publish unified Compose files
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          set -euo pipefail
          target="ubuntu@$DEPLOY_HOST"
          ssh_opts=(-i "$HOME/.ssh/id_ed25519" -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=30)
          staging="/home/ubuntu/.tempo-services-staging"
          install_root="/opt/1panel/docker/compose/tempo-services"

          rm -rf package
          mkdir -p package/sync
          cp deploy/tempo-services/docker-compose.yml package/docker-compose.yml
          cp services/sync/{Dockerfile,.dockerignore,go.mod,go.sum} package/sync/
          cp -R services/sync/{cmd,internal,licenses} package/sync/
          ssh "${ssh_opts[@]}" "$target" "rm -rf '$staging' && mkdir -p '$staging'"
          tar -C package -czf - . | ssh "${ssh_opts[@]}" "$target" "tar -xzf - -C '$staging'"

          prepare_script="$(base64 -w 0 <<'PY'
          import json
          import os
          import pwd
          import shutil
          import subprocess
          from pathlib import Path

          staging = Path('/home/ubuntu/.tempo-services-staging')
          install = Path('/opt/1panel/docker/compose/tempo-services')
          install.mkdir(parents=True, exist_ok=True)

          sync_env = install / 'sync.env'
          if not sync_env.exists():
              candidates = ['tempo-services-sync-1', 'qingxu-sync-1']
              payload = None
              for container in candidates:
                  result = subprocess.run(['docker', 'inspect', container], capture_output=True, text=True)
                  if result.returncode == 0:
                      payload = json.loads(result.stdout)[0]
                      break
              if payload is None:
                  raise SystemExit('No running Tempo sync container was found for safe configuration migration')
              allowed = {
                  'SYNC_TOKEN', 'SYNC_CORS_ORIGINS', 'SYNC_MAX_BODY_BYTES',
                  'SYNC_HEALTH_URL', 'SYNC_ADDR', 'SYNC_DATA_FILE', 'GOMEMLIMIT',
                  'AI_BASE_URL', 'AI_API_KEY', 'AI_MODEL',
              }
              values = {}
              for item in payload['Config'].get('Env', []):
                  key, _, value = item.partition('=')
                  if key in allowed:
                      values[key] = value
              if not values.get('SYNC_TOKEN'):
                  raise SystemExit('The existing sync token could not be preserved')
              sync_env.write_text(''.join(f'{key}={values[key]}\n' for key in sorted(values)), encoding='utf-8')
              os.chmod(sync_env, 0o600)

          for name in ('docker-compose.yml', 'sync'):
              target = install / name
              source = staging / name
              if target.is_dir():
                  shutil.rmtree(target)
              elif target.exists():
                  target.unlink()
              if source.is_dir():
                  shutil.copytree(source, target)
              else:
                  shutil.copy2(source, target)
          ubuntu = pwd.getpwnam('ubuntu')
          os.chown(sync_env, ubuntu.pw_uid, ubuntu.pw_gid)
          os.chmod(sync_env, 0o600)
          PY
          )"
          ssh "${ssh_opts[@]}" "$target" "printf '%s' '$prepare_script' | base64 --decode > /tmp/prepare-tempo-services.py && sudo -n python3 /tmp/prepare-tempo-services.py"

      - name: Deploy sync service and remove obsolete OTA signal
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          set -euo pipefail
          target="ubuntu@$DEPLOY_HOST"
          ssh_opts=(-i "$HOME/.ssh/id_ed25519" -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=30)
          ssh "${ssh_opts[@]}" "$target" '
            set -euo pipefail
            install_root="/opt/1panel/docker/compose/tempo-services"
            old_sync_config="$(docker inspect qingxu-sync-1 --format "{{index .Config.Labels \"com.docker.compose.project.config_files\"}}" 2>/dev/null || true)"
            old_signal_config="/home/ubuntu/.tempo-ota-signal/docker-compose.yml"

            cd "$install_root"
            docker compose build sync

            rollback() {
              docker compose down --remove-orphans || true
              if [ -n "$old_sync_config" ] && [ -f "$old_sync_config" ]; then
                docker compose --env-file "$install_root/sync.env" -p qingxu -f "$old_sync_config" up -d
              fi
            }
            trap rollback ERR

            if [ -n "$old_sync_config" ] && [ -f "$old_sync_config" ]; then
              docker compose --env-file "$install_root/sync.env" -p qingxu -f "$old_sync_config" down
            fi
            if [ -f "$old_signal_config" ]; then
              docker compose --env-file "$install_root/ota.env" -p tempo-ota-signal -f "$old_signal_config" down
            fi
            docker compose up -d --remove-orphans
            curl --fail --silent --show-error --retry 15 --retry-delay 2 http://127.0.0.1:8080/health
            trap - ERR
          '

      - name: Remove obsolete OTA OpenResty routes
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          set -euo pipefail
          target="ubuntu@$DEPLOY_HOST"
          ssh_opts=(-i "$HOME/.ssh/id_ed25519" -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=30)
          proxy_script="$(base64 -w 0 <<'PY'
          import re
          import shutil
          from pathlib import Path

          candidates = []
          for path in Path('/opt/1panel').rglob('*.conf'):
              try:
                  text = path.read_text(encoding='utf-8')
              except (OSError, UnicodeDecodeError):
                  continue
              if re.search(r'\bserver_name\b[^;]*\btodo\.darker\.one\b', text):
                  candidates.append((path, text))
          if not candidates:
              raise SystemExit('Unable to locate the todo.darker.one OpenResty vhost')
          path, text = sorted(candidates, key=lambda item: len(str(item[0])))[0]
          old = re.compile(r'\s*# tempo-(?:ota-signal|services) begin.*?# tempo-(?:ota-signal|services) end\s*', re.S)
          if old.search(text):
              text = old.sub('\n', text, count=1)
          backup = path.with_suffix(path.suffix + '.tempo-backup')
          shutil.copy2(path, backup)
          path.write_text(text, encoding='utf-8')
          Path('/tmp/tempo-vhost-path').write_text(str(path), encoding='utf-8')
          PY
          )"
          ssh "${ssh_opts[@]}" "$target" "printf '%s' '$proxy_script' | base64 --decode > /tmp/install-tempo-proxy.py && sudo -n python3 /tmp/install-tempo-proxy.py"
          ssh "${ssh_opts[@]}" "$target" '
            set -euo pipefail
            container="$(docker ps --format "{{.Names}} {{.Image}}" | awk "tolower(\$0) ~ /openresty/ {print \$1; exit}")"
            vhost="$(cat /tmp/tempo-vhost-path)"
            if ! docker exec "$container" openresty -t; then
              sudo -n cp "$vhost.tempo-backup" "$vhost"
              docker exec "$container" openresty -t
              exit 1
            fi
            docker exec "$container" openresty -s reload
          '

      - name: Register website and Compose in 1Panel
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          set -euo pipefail
          target="ubuntu@$DEPLOY_HOST"
          ssh_opts=(-i "$HOME/.ssh/id_ed25519" -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=30)
          register_script="$(base64 -w 0 <<'PY'
          import shutil
          import sqlite3
          from datetime import datetime, timezone
          from pathlib import Path

          database = Path('/opt/1panel/db/agent.db')
          backup_dir = Path('/opt/1panel/backup/tempo-services-registration')
          backup_dir.mkdir(parents=True, exist_ok=True)
          shutil.copy2(database, backup_dir / 'agent.db.before-registration')
          now = datetime.now(timezone.utc).strftime('%Y-%m-%d %H:%M:%S.%f%z')
          connection = sqlite3.connect(database)
          with connection:
              compose_path = '/opt/1panel/docker/compose/tempo-services/docker-compose.yml'
              row = connection.execute('select id from composes where name=?', ('tempo-services',)).fetchone()
              if row:
                  connection.execute('update composes set updated_at=?,path=?,is_pinned=1 where id=?', (now, compose_path, row[0]))
              else:
                  connection.execute('insert into composes(created_at,updated_at,name,path,is_pinned) values(?,?,?,?,1)', (now, now, 'tempo-services', compose_path))
              connection.execute("delete from composes where name in ('qingxu','tempo-ota-signal')")

              domain = 'todo.darker.one'
              website = connection.execute('select id from websites where primary_domain=?', (domain,)).fetchone()
              if website:
                  website_id = website[0]
                  connection.execute('update websites set updated_at=?,alias=?,remark=?,status=?,site_dir=? where id=?', (now, domain, 'Tempo 开发与部署文档', 'Running', '/opt/1panel/www/sites/todo.darker.one/docs-live/current', website_id))
              else:
                  cursor = connection.execute('''
                      insert into websites(
                          created_at,updated_at,protocol,primary_domain,type,alias,remark,status,http_config,
                          site_dir,error_log,access_log,default_server,ip_v6,rewrite,favorite
                      ) values(?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?)
                  ''', (now, now, 'HTTPS', domain, 'static', domain, 'Tempo 开发与部署文档', 'Running', '', '/opt/1panel/www/sites/todo.darker.one/docs-live/current', 1, 1, 0, 0, '', 1))
                  website_id = cursor.lastrowid
              existing_domain = connection.execute('select id from website_domains where website_id=? and domain=? and port=?', (website_id, domain, 443)).fetchone()
              if not existing_domain:
                  connection.execute('insert into website_domains(created_at,updated_at,website_id,domain,ssl,port) values(?,?,?,?,?,?)', (now, now, website_id, domain, 1, 443))
              registered_compose = connection.execute('select id,path from composes where name=?', ('tempo-services',)).fetchone()
              registered_website = connection.execute('select id,status,site_dir from websites where primary_domain=?', (domain,)).fetchone()
              if not registered_compose or not registered_website:
                  raise SystemExit('1Panel registration did not persist')
              print(f'1Panel Compose registered: tempo-services ({registered_compose[1]})')
              print(f'1Panel website registered: {domain} ({registered_website[1]})')
          connection.close()
          PY
          )"
          ssh "${ssh_opts[@]}" "$target" "printf '%s' '$register_script' | base64 --decode > /tmp/register-tempo-1panel.py && sudo -n python3 /tmp/register-tempo-1panel.py"

      - name: Verify production services
        run: |
          set -euo pipefail
          docs_html="$(curl --fail --silent --show-error --retry 10 --retry-all-errors --retry-delay 2 https://todo.darker.one/)"
          grep -q '<title>Tempo' <<< "$docs_html"
